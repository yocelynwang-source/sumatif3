<html>
<head>
	<title>Formulir Pendaftaran Siswa</title>
	<link rel="stylesheet" type="text/css" href="register.css">
</head>
<body>
	<div class="container" role="region" aria-labelledby="title">
		<h1 id="title"> Formulir Pendaftaran E commerce</h1>
		<h2 id="title"> Isi Data Dengan Lengkap Dan Benar</h2>
		
		<label for="name">Name* </label>
		<input id="name" name="name" type="text" placeholder="Contoh:Muhammad Raihan" required>
		<h3 id="title"> Nama sesuai identitas</h3>
		
		<label for="class">Usia*</label>
		<input id="class" name="class" type="text" placeholder="Contoh:Usia:9 tahun" required>
		<h4 id="title"> Usia saat ini</h4>
		
		<h1>Pilih ketertarikan (3 Pilihan)</h1>
		<label class="container-checkbox"> Dessert
			<input type="checkbox" name="Pilih Ekstrakulikuler" value="Basket">
			<span class="checkmark"></span>
		</label>
		<label class="container-checkbox"> Makanan Berat
			<input type="checkbox" name="Pilih Ekstrakulikuler" value="Futsal">
			<span class="checkmark"></span>
		</label>
		<label class="container-checkbox"> Makanan Ringan
			<input type="checkbox" name="Pilih Ekstrakulikuler" value="Paduan Suara">
			<span class="checkmark"></span>
		</label>
		<h4 id="title">boleh memilih dari satu(opsional)</h4>
		
		<h1>Pilih Perkerjaan(wajib pilih salah satu)</h1>
		<label class="container-radio">Pekerja Kantoran
			<input type="radio" name="Pilih Jadwal Belajar(wajib pilih salah satu)" value="Pagi(07.00-12.00)">
			<span class="checkmark"></span>
		</label>
		<label class="container-radio"> Pengusaha
			<input type="radio" name="Pilih Jadwal Belajar(wajib pilih salah satu)" value="Siang(12.30-17.00)">
			<span class="checkmark"></span>
		</label>
		<label class="container-radio"> Artis
			<input type="radio" name="Pilih Jadwal Belajar(wajib pilih salah satu)" value="Sore(17.30-20.30)">
			<span class="checkmark"></span>
		</label>
		<label class="container-radio">Campuran(fleksibel)
			<input type="radio" name="Pilih Jadwal Belajar(wajib pilih salah satu)" value="Campuran(fleksibel)">
			<span class="checkmark"></span>
		</label>
		<h5 id="title">satu pilihan wajib dipilih untuk kelengkapan data</h5>
		<div class="button-group">
			<button id="okBtn">Daftar Sekarang</button>
			<button id="clearBtn">Reset Form</button>
		</div>
		
		<div class="result" id="hasil">
			Data akan ditampilkan disini
		</div>
	</div>
	
	<script src="register.js"></script>
</body>
</html>
